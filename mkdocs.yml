site_name: CAH Game Backend
site_description: Documentation for the Cards Against Humanity-like game backend.
theme:
  name: material
  palette: 
    primary: deep purple
    accent: purple
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: setup.md
  - Game Logic: game_logic.md
  - API Reference: api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences
